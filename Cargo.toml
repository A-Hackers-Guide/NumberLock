[package]
name = "numberlock"
version = "1.0.0"
edition = "2021"
description = "Turn files and folders into password-locked numbers, and back."

[dependencies]
eframe = "0.31"
rfd = "0.15"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
flate2 = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
png = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
